name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast, dependency-light checks on every push/PR.
  fast-checks:
    name: Fast checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r sql/requirements.txt

      - name: Compile all Python sources
        run: python -m compileall -q pipeline app api reports sql scripts 2>&1 || true

      - name: Unit tests
        run: python -m unittest discover -s pipeline/tests -p "test_pipeline_unit.py" -v

      - name: ML model tests
        run: python -m unittest pipeline.tests.test_pipeline_ml -v

      - name: API smoke tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Data quality gate
        run: python reports/generate_data_quality_report.py --skip-db

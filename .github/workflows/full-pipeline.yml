name: Full pipeline validation

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  full-validation:
    name: Full pipeline validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/retail_analysis
      PIPELINE_TEMP_DIR: /tmp/retail_temp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r sql/requirements.txt

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER postgres WITH PASSWORD 'postgres' SUPERUSER;"
          sudo -u postgres psql -c "CREATE DATABASE retail_analysis OWNER postgres;"

      - name: Unit + integration tests
        run: python -m unittest discover -s pipeline/tests -v

      - name: Run full pipeline
        run: python pipeline/run_pipeline.py

      - name: Run ML model + tuning
        run: |
          python pipeline/run_ml.py
          python pipeline/run_ml_tune.py

      - name: Validate SQL layer
        run: python sql/verify_pipeline.py

      - name: Generate data quality report
        run: python reports/generate_data_quality_report.py

      - name: Run slow tests
        run: |
          export RUN_SLOW_TESTS=1
          python -m unittest pipeline.tests.test_pipeline_slow -v
